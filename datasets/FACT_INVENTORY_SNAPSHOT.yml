unique_name: FACT_INVENTORY_SNAPSHOT
object_type: dataset
label: Inventory Snapshot
description: Periodic-snapshot fact at DC x product x month-end grain. units_on_hand is a semi-additive
  balance (read as-of one snapshot date, never summed across snapshot dates); units_received / units_shipped_in_period
  are additive period flows. Joins the same conformed Date dimension as the transaction fact, with no
  role-play (single date column — Rule 21).
connection_id: Connection - Fulfillment Cost to Serve
table: FACT_INVENTORY_SNAPSHOT
columns:
- name: SNAPSHOT_DATE_KEY
  data_type: long
- name: DC_ID
  data_type: long
- name: PRODUCT_ID
  data_type: long
- name: UNITS_ON_HAND
  data_type: long
- name: UNITS_RECEIVED
  data_type: long
- name: UNITS_SHIPPED_IN_PERIOD
  data_type: long
